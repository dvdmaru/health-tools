<section class="report-entry" aria-labelledby="reader-heading">
  <h1 class="pg-h1" id="reader-heading">{{home_title}}</h1>
  <div id="report-search" hidden>
    <label for="report-query">查報告上的中文、英文或縮寫</label>
    <input type="search" id="report-query" placeholder="例如 GPT、尿蛋白、Creatinine" maxlength="100" autocomplete="off" spellcheck="false" enterkeyhint="search">
    <p class="reader-status" role="status"></p>
    <ul class="reader-results" hidden>{{search_items}}</ul>
  </div>
  <p class="reader-links">照著範例報告找　<a href="/adult-report/#read-alt">肝功能（GPT）</a> · <a href="/adult-report/#read-urine-protein">尿蛋白（＋）</a> · <a href="/adult-report/#read-alt-field-5">怎麼看 H 標記？</a></p>
  <a href="/indicators/">瀏覽已收錄指標</a> · <a href="/adult-report/">成人健檢報告欄位導覽</a>
</section>
<script>
(() => {
  const panel = document.getElementById('report-search');
  const input = panel.querySelector('input');
  const results = panel.querySelector('ul');
  const status = panel.querySelector('[role=status]');
  const normalize = text => text.normalize('NFKC').toLowerCase();
  const terms = text => normalize(text).split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const compact = text => terms(text).join('');
  const entries = Array.from(results.children, item => ({
    item, names: item.dataset.names.split('|').map(compact)
  }));
  function update() {
    const query = input.value.trim();
    const tokens = terms(query);
    const joined = tokens.join('');
    let count = 0;
    for (const {item, names} of entries) {
      const matches = joined && (names.some(name => name.includes(joined)) ||
        tokens.every(token => names.some(name => name.includes(token))));
      item.hidden = !matches;
      if (matches) count++;
    }
    results.hidden = !count;
    status.textContent = !query ? '' : count ? '找到 ' + count + ' 個項目' :
      '本站尚未收錄符合的名稱。可試試報告上括號內的別名，或瀏覽下方已收錄指標。';
  }
  input.addEventListener('input', update);
  input.addEventListener('keydown', event => {
    if (event.key !== 'Enter' || event.isComposing || event.keyCode === 229) return;
    const first = results.querySelector('li:not([hidden]) a');
    if (first) {
      event.preventDefault();
      first.focus();
    }
  });
  panel.hidden = false;
  update();
})();
</script>
