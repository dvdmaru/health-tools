# 最小 quality gate：PR 與 main push 跑回歸測試與禁詞 gate。
# 鎖的行為都是「壞了不會在畫面上立刻看見」的那一種：禁詞放行條件、判準 schema 的
# 出處必填、build 的決定性。
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # jsonschema＝判準 schema 測試的硬相依。不裝而讓那個測試檔 import 失敗或自我 skip，
      # 就是 CI 假覆蓋——綠燈但什麼都沒驗。
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils  # check-receipts.py 需要 pdftotext
      - run: pip install 'markdown==3.10.2' 'jsonschema==4.26.0'
      # 決定性驗收放在最前面：同輸入連跑兩次，全站產物 SHA-256 必須相同（禁時間戳）。
      # 跑序固定 build-articles → gen-indicator → build-sitemap：指標頁的 sitemap part
      # 必須在合併前寫好，llms.txt 的指標區塊必須在 build-articles 重寫之後才補。
      # 順便讓後面的測試與禁詞 gate 有真的產物可掃——乾淨 checkout 沒有 public-health/
      # 產物（不入版控），先 build 才不會變成「掃了 0 個檔案然後綠燈」的假覆蓋。
      - name: build twice and compare hashes
        run: |
          python scripts/build-articles.py
          python scripts/gen-indicator.py
          python scripts/build-sitemap.py
          find public-health -type f -exec sha256sum {} + | sort -k2 > /tmp/build1.sha
          python scripts/build-articles.py
          python scripts/gen-indicator.py
          python scripts/build-sitemap.py
          find public-health -type f -exec sha256sum {} + | sort -k2 > /tmp/build2.sha
          diff /tmp/build1.sha /tmp/build2.sha
      - run: python -m unittest discover -s tests -v
      # 禁詞 gate 對實際產物再跑一次（絕對禁詞命中即 exit 1）。
      - run: python scripts/check-health-terms.py
      # 收據 gate：每一條判準／變更史／限制列的引句都要 grep 得回快照。
      # ⚠️ CI 上 licensed-cite-only 的快照不在（不入版控，見 .gitignore），
      # 那些列會印 SKIP 而不是 PASS——這是誠實的缺口，不是漏驗；
      # 它們的完整驗證在本機跑（PASS 78／SKIP 0），紀錄在 PR 描述裡。
      # exit 1 的條件只有：doc_id 指不到 manifest、引句為空、引句在快照裡找不到。
      - run: python scripts/check-receipts.py
