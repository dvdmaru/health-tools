# 最小 quality gate：PR 與 main push 跑回歸測試與禁詞 gate。
# 鎖的行為都是「壞了不會在畫面上立刻看見」的那一種：禁詞放行條件、判準 schema 的
# 出處必填、build 的決定性。
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # jsonschema＝判準 schema 測試的硬相依。不裝而讓那個測試檔 import 失敗或自我 skip，
      # 就是 CI 假覆蓋——綠燈但什麼都沒驗。
      - run: pip install 'markdown==3.10.2' 'jsonschema==4.26.0'
      # 決定性驗收放在最前面：同輸入連跑兩次，全站產物 SHA-256 必須相同（禁時間戳）。
      # 順便讓後面的測試與禁詞 gate 有真的產物可掃——乾淨 checkout 沒有 public-health/
      # 產物（不入版控），先 build 才不會變成「掃了 0 個檔案然後綠燈」的假覆蓋。
      - name: build twice and compare hashes
        run: |
          python scripts/build-articles.py
          python scripts/build-sitemap.py
          find public-health -type f -exec sha256sum {} + | sort -k2 > /tmp/build1.sha
          python scripts/build-articles.py
          python scripts/build-sitemap.py
          find public-health -type f -exec sha256sum {} + | sort -k2 > /tmp/build2.sha
          diff /tmp/build1.sha /tmp/build2.sha
      - run: python -m unittest discover -s tests -v
      # 禁詞 gate 對實際產物再跑一次（絕對禁詞命中即 exit 1）。
      - run: python scripts/check-health-terms.py
